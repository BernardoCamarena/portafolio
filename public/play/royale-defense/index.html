<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Royale Defense — Jugar en el navegador · Bernardo Camarena</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #0a0a0b; --bg-2: #111113; --fg: #f4f4f5;
      --fg-dim: rgba(244,244,245,.62); --line: rgba(244,244,245,.1);
      --aurora: linear-gradient(125deg,#3730a3 0%,#5b21b6 25%,#155e75 50%,#6b21a8 75%,#1e3a8a 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; }
    header {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 18px 28px; border-bottom: 1px solid var(--line);
      font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; font-size: 11px;
      letter-spacing: .14em; text-transform: uppercase; color: var(--fg-dim);
    }
    header a { color: var(--fg); text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
    header a:hover { color: #a5b4fc; }
    header .title { color: var(--fg); }
    main { flex: 1; display: grid; place-items: center; padding: 24px; }
    .stage {
      position: relative; width: min(100%, calc((100vh - 170px) * 1.6)); aspect-ratio: 16 / 10;
      border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #000;
      box-shadow: 0 40px 120px -40px rgba(99,102,241,.35);
    }
    canvas { display: block; width: 100%; height: 100%; background: #231f20; }
    .loader {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at center, #15152a 0%, #0a0a0b 70%); transition: opacity .5s;
    }
    .loader.hidden { opacity: 0; pointer-events: none; }
    .loader h1 { font-size: clamp(28px, 4vw, 48px); font-weight: 600; letter-spacing: -.03em; }
    .loader p { font-family: ui-monospace, Consolas, monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-dim); }
    .bar { width: min(320px, 70%); height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0; background: var(--aurora); background-size: 200% 200%; transition: width .2s; }
    .error { color: #fca5a5; max-width: 420px; text-align: center; font-size: 14px; line-height: 1.5; }
    footer {
      display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 14px 28px; border-top: 1px solid var(--line);
      font-family: ui-monospace, Consolas, monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-dim);
    }
    button {
      font: inherit; color: var(--fg); background: transparent; cursor: pointer;
      border: 1px solid var(--line); border-radius: 99px; padding: 8px 14px; letter-spacing: .12em;
    }
    button:hover { border-color: rgba(244,244,245,.3); }
    .mobile-note { display: none; }
    @media (hover: none) and (pointer: coarse) { .mobile-note { display: block; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="/#games">← Volver al portafolio</a>
      <span class="title">Royale Defense · v0.1 WebGL</span>
    </header>
    <main>
      <div class="stage">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div class="loader" id="loader">
          <h1>Royale Defense</h1>
          <div class="bar"><span id="bar"></span></div>
          <p id="status">Cargando · 16 MB</p>
          <p class="mobile-note">Pensado para escritorio con mouse</p>
        </div>
      </div>
    </main>
    <footer>
      <span>Arrastra las cartas al campo · Defiende el reino</span>
      <button id="fullscreen" type="button">Pantalla completa ⤢</button>
    </footer>
  </div>
  <script>
    (function () {
      var canvas = document.getElementById('unity-canvas');
      var loader = document.getElementById('loader');
      var bar = document.getElementById('bar');
      var status = document.getElementById('status');
      var config = {
        dataUrl: 'Build/royale.data.br',
        frameworkUrl: 'Build/royale.framework.js.br',
        codeUrl: 'Build/royale.wasm.br',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'Bernardo Camarena',
        productName: 'Royale Defense',
        productVersion: '0.1',
        showBanner: function (msg, type) { if (type === 'error') showError(msg); }
      };
      function showError(msg) {
        loader.classList.remove('hidden');
        status.className = 'error';
        status.textContent = 'No se pudo cargar el juego en este navegador. ' + (msg || '');
      }
      var script = document.createElement('script');
      script.src = 'Build/royale.loader.js';
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          bar.style.width = Math.round(p * 100) + '%';
          status.textContent = 'Cargando · ' + Math.round(p * 100) + '%';
        }).then(function (instance) {
          loader.classList.add('hidden');
          document.getElementById('fullscreen').onclick = function () { instance.SetFullscreen(1); };
        }).catch(showError);
      };
      script.onerror = function () { showError(''); };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
